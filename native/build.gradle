plugins {
    id 'java'
}

description = 'Aws - Native'

dependencies {
    implementation group: 'org.ballerinalang', name: 'ballerina-runtime', version: "${ballerinaLangVersion}"
    implementation group: 'software.amazon.awssdk', name: 'auth', version: "${awsJavaSdkVersion}"
    implementation group: 'software.amazon.awssdk', name: 'aws-core', version: "${awsJavaSdkVersion}"
    implementation group: 'software.amazon.awssdk', name: 'sdk-core', version: "${awsJavaSdkVersion}"
    implementation group: 'software.amazon.awssdk', name: 'sts', version: "${awsJavaSdkVersion}"
    implementation group: 'software.amazon.awssdk', name: 'sso', version: "${awsJavaSdkVersion}"
    implementation group: 'software.amazon.awssdk', name: 'ssooidc', version: "${awsJavaSdkVersion}"
    implementation group: 'software.amazon.awssdk', name: 'profiles', version: "${awsJavaSdkVersion}"
    implementation group: 'software.amazon.awssdk', name: 'regions', version: "${awsJavaSdkVersion}"
    implementation group: 'software.amazon.awssdk', name: 'http-client-spi', version: "${awsJavaSdkVersion}"
    implementation group: 'software.amazon.awssdk', name: 'http-auth-aws', version: "${awsJavaSdkVersion}"
    implementation group: 'software.amazon.awssdk', name: 'http-auth-spi', version: "${awsJavaSdkVersion}"
    implementation group: 'software.amazon.awssdk', name: 'identity-spi', version: "${awsJavaSdkVersion}"
    implementation group: 'software.amazon.awssdk', name: 'utils', version: "${awsJavaSdkVersion}"
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

compileJava {
    doFirst {
        options.compilerArgs = [
                '--module-path', classpath.asPath,
        ]
        classpath = files()
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId "aws-native"
            version = project.version
            artifact jar
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/ballerina-platform/module-ballerinax-aws")
            credentials {
                username = System.getenv("publishUser")
                password = System.getenv("publishPAT")
            }
        }
    }
}
